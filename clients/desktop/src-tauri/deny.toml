# cargo-deny policy — supply-chain gate for the DETACHED Tauri shell workspace.
# COPY of ../../deny.toml (root) — keep all three in sync; see scripts/check-deny-sync.sh,
# which CI runs so a policy change to one copy cannot silently miss the others.
#
# This workspace had no audit or deny coverage at all until SP-12, while carrying the
# largest dependency surface in the repo (Tauri, wry, WebKitGTK bindings, cpal, quinn,
# jni, hwenc, nokhwa). The gap was the finding — a reachable advisory in any of those
# would have gone equally unnoticed.

[advisories]
# RustSec advisories: any known-vulnerable dependency fails CI (cargo audit runs too;
# this is the second, policy-level net).
version = 2
yanked = "deny"
# Unmaintained advisories fire only for crates this workspace depends on DIRECTLY.
# The shell's transitive surface is Tauri's: gtk-rs GTK3 bindings, the `unic-*` family,
# `paste`, `proc-macro-error`. All are unmaintained, none is fixable from here, and none
# is a vulnerability — they are "nobody is shipping updates" notices. Erroring on them
# would make this gate permanently red, and a gate nobody can turn green gets deleted
# (the same reasoning the CI file already records for this crate's clippy). Vulnerability,
# unsound, and yanked advisories still fail, transitive or not — those are the ones that
# matter, and this is the whole reason the gate exists.
unmaintained = "workspace"
ignore = [
  # proc-macro-error2 (build-time proc-macro helper) is unmaintained; it reaches us only
  # through vodozemac → matrix-pickle-derive, i.e. the audited ratchet we deliberately
  # don't fork. Compile-time only, no runtime attack surface. Re-check on vodozemac bumps.
  { id = "RUSTSEC-2026-0173", reason = "transitive build-dep of vodozemac; compile-time only" },
  # quick-xml memory-exhaustion + quadratic-parse DoS (both CVSS 7.5). Two BUILD-TIME
  # paths, neither of which ever sees attacker-supplied XML at runtime:
  #   quick-xml 0.39.4 ← plist ← tauri-utils      (Info.plist handling, macOS-shaped)
  #   quick-xml 0.30.0 ← xcb                      (X11 protocol descriptions, build script)
  # Neither can move: 0.x minor bumps are semver-breaking, so the fix needs the Tauri and
  # xcb chains to bump first. Narrow by advisory ID on purpose — this must NOT become a
  # blanket allowance. Re-check on every Tauri bump; drop the moment either chain moves.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist/xcb; build-time only, no runtime XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist/xcb; build-time only, no runtime XML" },
]

[licenses]
version = 2
# Sona itself is AGPL-3.0-or-later. Dependencies must be permissive or weak-copyleft.
allow = [
  # Sona's own crates.
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  # webpki-roots (Mozilla CA bundle data) — permissive data license.
  "CDLA-Permissive-2.0",
  "OpenSSL",
  # IJG (the original libjpeg license) — permissive, reaches the shell through the
  # camera/image chain. Allowed here only; the root and clients workspaces do not pull
  # it and must not gain it silently.
  "IJG",
]

# ring bundles code under the OpenSSL/ISC/MIT umbrella; the standard clarification.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate crate versions bloat the audit surface; warn, don't fail (transitive deps
# make this unavoidable at times).
multiple-versions = "warn"
# The dependency policy from ARCHITECTURE.md §11: crypto comes only from the vetted set
# (vodozemac, ct-merkle, ed25519-dalek, RustCrypto). Deny known-bad or overlapping
# crypto crates sneaking in transitively.
deny = [
  { crate = "openssl", reason = "rustls/RustCrypto only — no C crypto stack" },
  { crate = "native-tls", reason = "rustls only" },
  { crate = "md5", reason = "broken hash" },
  # NOTE: sha1 is NOT banned — axum/tungstenite use it for the RFC 6455 WebSocket
  # accept-key handshake, a protocol checksum with no security reliance.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
