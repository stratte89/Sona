[workspace]
resolver = "2"
members = [
    "crates/protocol-types",
    "crates/crypto-core",
    "crates/kt-log",
    "crates/server",
    "crates/auditor",
]
# The clients live in their own workspace so the Android/desktop builds never try to
# cross-compile the server's native deps (tokio/axum). They reference the shared crates
# above by relative path.
exclude = ["clients", "fuzz"]

# Shared dependency versions pinned once here, referenced via `workspace = true`
# in each crate so the whole tree stays on the same vetted versions.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# HKDF-SHA256 mixes the Argon2id output with the OS-keyring device key (vault v2).
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
# Audited (Least Authority, 2022) pure-Rust Olm Double Ratchet — our E2EE engine.
# Same guarantees as the Signal ratchet: forward secrecy + post-compromise security.
vodozemac = "0.10"
# RFC 6962 append-only Merkle log (inclusion + consistency proofs) — the verifiable
# substrate for Key Transparency. We do NOT hand-roll consistency-proof verification.
ct-merkle = { version = "0.3", features = ["serde"] }
# Standard, vetted Ed25519 — signs Key Transparency tree heads (server) and entries.
ed25519-dalek = { version = "2", features = ["rand_core"] }

[profile.release]
# Security-relevant: keep overflow checks on even in release. A silent wrap in
# crypto/length handling is worse than a panic.
overflow-checks = true
# Reproducibility + size: strip symbol tables (host paths and build noise live there).
# Panic-location paths are additionally remapped in the container build.
strip = "symbols"
