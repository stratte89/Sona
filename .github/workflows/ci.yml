# CI for both Cargo workspaces (backend at the root, clients under clients/).
# Gates: tests, clippy as errors, rustfmt, cargo-audit (RustSec advisories),
# cargo-deny (licenses + duplicate-crate + source policy, see deny.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy (${{ matrix.workspace.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - { name: backend, dir: "." , flags: "" }
          # os-keyring is what the Tauri shell ships with; its Linux backend
          # (Secret Service) links libdbus.
          - { name: clients, dir: "clients", flags: "--features os-keyring" }
    steps:
      - uses: actions/checkout@v4
      - name: Install libdbus (keyring backend)
        if: matrix.workspace.name == 'clients'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace.dir }}
      - name: cargo fmt
        working-directory: ${{ matrix.workspace.dir }}
        run: cargo fmt --all --check
      - name: cargo test
        working-directory: ${{ matrix.workspace.dir }}
        run: cargo test ${{ matrix.workspace.flags }}
      - name: cargo clippy
        working-directory: ${{ matrix.workspace.dir }}
        run: cargo clippy --all-targets ${{ matrix.workspace.flags }} -- -D warnings

  # The Tauri shell is a DETACHED package (its own [workspace]), so neither matrix leg
  # above compiles it — which meant the whole desktop crate had no CI at all. That is how
  # a one-enum audio regression (see docs/CALL_AUDIO.md) went six releases unnoticed with
  # nothing able to catch it. Lib tests only: no webview is driven here, just the logic
  # that has unit tests, including the audio buffer-size guards.
  desktop:
    name: test & clippy (desktop shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri + audio system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
      - name: cargo fmt
        working-directory: clients/desktop/src-tauri
        run: cargo fmt --all --check
      - name: cargo test
        working-directory: clients/desktop/src-tauri
        # --lib: the harness tests that drive real speakers are #[ignore]d and stay that way.
        run: cargo test --lib
      - name: cargo clippy
        working-directory: clients/desktop/src-tauri
        # Not `-D warnings` yet: this crate carries a backlog the other two do not, and a
        # gate nobody can turn green gets deleted. Tighten once the backlog is cleared.
        run: cargo clippy --all-targets

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - run: cargo audit --file clients/Cargo.lock
      # The Tauri shell is a DETACHED workspace with its own lock and the LARGEST
      # dependency surface in the repo (Tauri, wry, WebKitGTK bindings, cpal, quinn, jni,
      # hwenc, nokhwa). It was never audited (SP-12) — the gap was the finding, not any
      # one advisory: a reachable vuln in cpal, quinn, jni, or a codec would have gone
      # equally unnoticed.
      #
      # Two ignores, narrow and by ID. RUSTSEC-2026-0194/-0195 are quick-xml
      # memory-exhaustion and quadratic-parse DoS (CVSS 7.5 each) reaching us on two
      # BUILD-TIME paths that never see attacker-supplied XML at runtime:
      #   quick-xml 0.39.4 ← plist ← tauri-utils   (Info.plist, macOS-shaped)
      #   quick-xml 0.30.0 ← xcb                   (X11 protocol descriptions, build script)
      # Neither can move — 0.x minor bumps are semver-breaking — so the real fix is a
      # Tauri/xcb chain bump. Re-check on every Tauri bump and drop these the moment
      # either chain moves. Do NOT widen this list; the yanked `spin` was BUMPED, not
      # ignored, and anything new must be too.
      - run: >
          cargo audit --file clients/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  deny:
    name: cargo deny (licenses & sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - run: cargo deny check
        working-directory: clients
      - run: cargo deny check
        working-directory: clients/desktop/src-tauri
      # Three policy copies is three things that can drift, and a policy that silently
      # covers one workspace reads like coverage without being it.
      - run: ./scripts/check-deny-sync.sh

  # The Android build is edge-to-edge: screen-anchored UI that forgets
  # env(safe-area-inset-*) ends up under the status bar / gesture bar. Keep that mechanical.
  ui:
    name: safe-area lint (edge-to-edge UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 clients/desktop/scripts/check-safe-area.py

  # Keep the monoliths from coming back: fail if a non-exempt source file grows
  # past the line cap (see scripts/no-monolith.sh for the exempt list + rationale).
  no-monolith:
    name: no-monolith ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/no-monolith.sh

  # Short smoke-fuzz of every wire-facing parser. Not a soak (run those locally /
  # scheduled); this catches "the parser now panics on garbage" regressions.
  fuzz:
    name: smoke fuzz (parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: fuzz each target for 30s
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096
          done
